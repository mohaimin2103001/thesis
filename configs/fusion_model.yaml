# Deep Visual-Geometry Fusion Model Configuration
visual_backbone: "resnet34"
visual_feature_dim: 512
geometry_feature_dim: 10
geometry_hidden_dim: 64

fusion:
  type: "concatenation_mlp"  # z = [f_visual; f_geometry] -> MLP(z)
  fused_dim: 256
  dropout: 0.3

multi_task_heads:
  state:
    out_dim: 2
  direction:
    out_dim: 2
  rot:
    out_dim: 1

physics_guidance:
  enabled: true
  consistency_loss_weight: 0.2  # lambda_3
  rot_approx_factor: 1.0        # ROT ~ v * kappa
  # AIS SOG is NEVER used during final inference. Regularization only applies during training.
