# Visual Baseline (Image-Only & Wake-Only) Configuration
backbone: "resnet34"
pretrained: true
in_channels: 3
img_size: [384, 384]

heads:
  state:
    type: "classification"
    num_classes: 2  # Straight (0), Turning (1)
  direction:
    type: "classification"
    num_classes: 2  # Port (0), Starboard (1) - computed only on turning samples
  rot:
    type: "regression"
    out_dim: 1      # Continuous signed ROT in deg/min

training:
  batch_size: 16
  epochs: 50
  lr: 0.0001
  weight_decay: 0.01
  mixed_precision: true
  clip_grad_norm: 1.0
  loss_weights:
    state: 1.0
    direction: 1.0
    rot: 0.5
